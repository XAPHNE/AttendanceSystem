name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Java 25 on ${{ matrix.os }}
    strategy:
      # One OS failing shouldn't hide whether the others pass
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # The runner has no display, so the UI tests run on a virtual one
            verify: xvfb-run -a ./mvnw -B verify
          - os: windows-latest
            verify: .\mvnw.cmd -B verify
          - os: macos-latest
            verify: ./mvnw -B verify
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ${{ matrix.verify }}
      - name: Upload test and coverage reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}
          path: |
            target/surefire-reports
            target/site/jacoco

  newest-java:
    name: Java 27 (early warning)
    # Shows when the next Java version breaks the build, without blocking merges
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
          cache: maven
      - run: xvfb-run -a ./mvnw -B verify
