name: Release

# Pushing a tag like v1.2.0 builds the app for each OS and publishes it as a GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package for ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the tag is a release version
        # The macOS installer refuses a version starting with 0, so stop before building anything
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like v1.2.0, with a first number of 1 or more"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Read the version from the tag
        # Installers only accept a plain number like 1.2.0, so drop the v
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Package for Linux
        if: runner.os == 'Linux'
        # CI has already tested this commit, so the tests aren't run again here
        run: |
          sudo apt-get install -y fakeroot
          ./mvnw -B -Pdist clean package -DskipTests -Ddist.version="$VERSION"
          mkdir upload
          tar -czf "upload/AttendanceSystem-$VERSION-linux-x64.tar.gz" -C target/dist AttendanceSystem
          ./mvnw -B -Pdist package -DskipTests -Ddist.version="$VERSION" \
            -Ddist.type=DEB -Ddist.shortcuts=true -Ddist.linux-deps=libgtk-3-0
          cp target/dist/*.deb "upload/AttendanceSystem-$VERSION-linux-amd64.deb"
      - name: Package for Windows
        if: runner.os == 'Windows'
        # A zipped folder rather than an MSI, which would need the WiX Toolset installed
        run: |
          ./mvnw.cmd -B -Pdist clean package -DskipTests -Ddist.version="$VERSION"
          mkdir upload
          7z a "upload/AttendanceSystem-$VERSION-windows-x64.zip" ./target/dist/AttendanceSystem
      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          ./mvnw -B -Pdist clean package -DskipTests -Ddist.version="$VERSION" -Ddist.type=DMG
          mkdir upload
          cp target/dist/*.dmg "upload/AttendanceSystem-$VERSION-macos-$(uname -m).dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}
          path: upload/*

  publish:
    name: Publish the release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      # Creating a release writes to the repository
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: upload
          merge-multiple: true
      - name: Create the release with the packages attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" upload/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
